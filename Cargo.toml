[package]
name = "mywa-sockets"
version = "11.0.0"
edition = "2021"
rust-version = "1.95"
description = "Luoyisse WhatsApp bot"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.12"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "cookies", "gzip"] }
scraper = "0.24"
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
webp = { version = "0.3", default-features = false }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f8165f282008935732e0b26d6f5cca5038ecd222", default-features = false, features = ["sqlite-storage", "tokio-native", "tokio-transport", "ureq-client"] }
zip = { version = "2", default-features = false }

[dev-dependencies]
axum = "0.8"

[profile.dev]
debug = 0
